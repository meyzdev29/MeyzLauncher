name: 2 - Build APK depuis le repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: launcher

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Accepter les licences Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "SDKM=$SDKM" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Lancer le script de build Android
        run: |
          chmod +x android-build.sh
          ./android-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MeyzLauncher-apk
          path: launcher/Amethyst-Android/app_pojavlauncher/build/outputs/apk/debug/*.apk
          
