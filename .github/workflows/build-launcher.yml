name: 2 - Build APK depuis le repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: launcher

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Accepter les licences Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "SDKM=$SDKM" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Appliquer les patchs du launcher
        run: |
          cd Amethyst-Android
          if [ -f "../CMakeLists.patch" ]; then git apply ../CMakeLists.patch || true; fi
          if [ -f "../JavaLauncher.patch" ]; then git apply ../JavaLauncher.patch || true; fi
          if [ -f "../MinecraftDownloader.patch" ]; then git apply ../MinecraftDownloader.patch || true; fi
          if [ -f "../MinecraftResourceDownloadTask.patch" ]; then git apply ../MinecraftResourceDownloadTask.patch || true; fi
          if [ -f "../Tools.patch" ]; then git apply ../Tools.patch || true; fi

      - name: Nettoyer les ressources en double
        run: |
          cd Amethyst-Android
          # Supprime les doublons PNG des icônes pour laisser place aux versions WebP
          find app_pojavlauncher/src/main/res -name "ic_launcher*.png" -delete || true

      - name: Compiler l'APK avec Gradle
        run: |
          cd Amethyst-Android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeyzLauncher-apk
          path: launcher/Amethyst-Android/app_pojavlauncher/build/outputs/apk/debug/*.apk
          
