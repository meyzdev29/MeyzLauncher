name: MeyzLauncher Auto Build

# Pas besoin de fork : ce workflow clone Amethyst, le renomme, applique tes patchs
# (ex. gestionnaire de skins) puis compile l'APK.

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Depot a cloner"
        default: "AngelAuraMC/Amethyst-Android"
      upstream_branch:
        description: "Branche (vide = branche par defaut)"
        default: ""

env:
  APP_NAME: MeyzLauncher
  APP_ID: com.meyz.launcher

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Accepter les licences Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "SDKM=$SDKM" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Cloner le launcher
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --get-regexp insteadOf
          BRANCH=""
          [ -n "${{ inputs.upstream_branch }}" ] && BRANCH="--branch ${{ inputs.upstream_branch }}"
          git clone --depth 1 --recurse-submodules $BRANCH \
            "https://github.com/${{ inputs.upstream_repo }}.git" launcher

      - name: Trouver le module de l'appli
        run: |
          cd launcher
          GRADLE=$(grep -rl "applicationId" --include=build.gradle --include=build.gradle.kts . | head -1 || true)
          [ -n "$GRADLE" ] || { echo "Module introuvable"; exit 1; }
          echo "Fichier trouve : $GRADLE"
          echo "MODULE_DIR=$(dirname "$GRADLE")" >> "$GITHUB_ENV"
          echo "GRADLE_FILE=$GRADLE" >> "$GITHUB_ENV"

      - name: Renommer en MeyzLauncher
        run: |
          cd launcher
          sed -i -E "s/applicationId[ =]+['\"][^'\"]+['\"]/applicationId \"$APP_ID\"/" "$GRADLE_FILE"
          find "$MODULE_DIR/src/main/res" -name strings.xml -exec \
            sed -i -E "s|(<string name=\"app_name\"[^>]*>)[^<]*(</string>)|\1$APP_NAME\2|" {} +

      - name: Appliquer mes patchs (patches/*.patch)
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "Patch : $p"
            git -C launcher apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - name: Installer le NDK demande par le projet
        run: |
          cd launcher
          NDK=$(grep -rhoE "ndkVersion[ =]+['\"][0-9.]+" --include=build.gradle --include=build.gradle.kts . | head -1 | grep -oE "[0-9][0-9.]+" || true)
          echo "NDK demande : ${NDK:-aucun}"
          if [ -n "$NDK" ]; then "$SDKM" "ndk;$NDK"; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('patches/**') }}-${{ github.run_id }}
          restore-keys: gradle-

      - name: Compiler l'APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew ":$(basename "$MODULE_DIR"):assembleDebug" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeyzLauncher-apk
          path: launcher/**/build/outputs/apk/debug/*.apk
