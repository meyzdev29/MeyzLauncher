name: MeyzLauncher Auto Build

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Depot a cloner"
        default: "AngelAuraMC/Amethyst-Android"
      upstream_branch:
        description: "Branche (vide = branche par defaut)"
        default: ""

env:
  APP_NAME: MeyzLauncher
  APP_ID: com.meyz.launcher

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Accepter les licences Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "SDKM=$SDKM" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Cloner le launcher
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          BRANCH=""
          [ -n "${{ inputs.upstream_branch }}" ] && BRANCH="--branch ${{ inputs.upstream_branch }}"
          git clone --depth 1 --recurse-submodules $BRANCH \
            "https://github.com/${{ inputs.upstream_repo }}.git" launcher

      - name: Trouver le module de l'appli
        run: |
          cd launcher
          GRADLE=$(grep -rl "applicationId" --include=build.gradle --include=build.gradle.kts . | head -1 || true)
          [ -n "$GRADLE" ] || { echo "Module introuvable"; exit 1; }
          echo "Fichier trouve : $GRADLE"
          echo "MODULE_DIR=$(dirname "$GRADLE")" >> "$GITHUB_ENV"
          echo "GRADLE_FILE=$GRADLE" >> "$GITHUB_ENV"

      - name: Renommer en MeyzLauncher (id + nom)
        run: |
          cd launcher
          sed -i -E "s/applicationId[ =]+['\"][^'\"]+['\"]/applicationId \"$APP_ID\"/" "$GRADLE_FILE"
          find "$MODULE_DIR/src/main/res" -name strings.xml -exec \
            sed -i -E "s|(<string name=\"app_name\"[^>]*>)[^<]*(</string>)|\1$APP_NAME\2|" {} +

      - name: Renommer partout dans les textes de l'appli
        run: |
          cd launcher
          # Remplace Amethyst / PojavLauncher dans tous les strings.xml (toutes les langues).
          # Les lignes de credits, licence, "base sur", fork et les liens sont ignorees
          # pour garder les mentions legales de la licence LGPL.
          find "$MODULE_DIR/src/main/res" -path "*/values*/strings.xml" -print0 | xargs -0 perl -pi -e 'if (!/credit|licen|based on|fork|copyright|boardwalk|http/i) { s/(?<![\/\w-])(?:Amethyst|PojavLauncher|Pojav Launcher)(?![\w-])/MeyzLauncher/g }'

      - name: Remplacer l'icone partout (icon.png)
        run: |
          if [ ! -f icon.png ]; then
            echo "Pas de icon.png a la racine du repo : icone inchangee"
            exit 0
          fi
          sudo apt-get install -y imagemagick > /dev/null
          cd launcher
          RES="$MODULE_DIR/src/main/res"

          # Anciennes icones du lanceur (xml adaptatif + webp) qui masqueraient nos PNG
          find "$RES" -path "*mipmap-*" \( -name "ic_launcher*.xml" -o -name "ic_launcher*.webp" -o -name "ic_launcher*.png" \) -delete

          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in "${!SIZES[@]}"; do
            s=${SIZES[$d]}
            mkdir -p "$RES/mipmap-$d"
            convert "$GITHUB_WORKSPACE/icon.png" -resize ${s}x${s} "$RES/mipmap-$d/ic_launcher.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

          # Logos internes (images dont le nom contient pojav ou amethyst)
          find "$RES" -type f \( -iname "*pojav*" -o -iname "*amethyst*" \) \( -name "*.png" -o -name "*.webp" \) | while read -r f; do
            dim=$(identify -format "%wx%h" "$f")
            echo "Logo remplace : $f ($dim)"
            convert "$GITHUB_WORKSPACE/icon.png" -resize "$dim" -background none -gravity center -extent "$dim" "$f"
          done

      - name: Appliquer mes patchs (patches/*.patch)
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "Patch : $p"
            git -C launcher apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - name: Installer le NDK demande par le projet
        run: |
          cd launcher
          NDK=$(grep -rhoE "ndkVersion[ =]+['\"][0-9.]+" --include=build.gradle --include=build.gradle.kts . | head -1 | grep -oE "[0-9][0-9.]+" || true)
          echo "NDK demande : ${NDK:-aucun}"
          if [ -n "$NDK" ]; then "$SDKM" "ndk;$NDK"; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('patches/**') }}-${{ github.run_id }}
          restore-keys: gradle-

      - name: Compiler l'APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew ":$(basename "$MODULE_DIR"):assembleDebug" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeyzLauncher-apk
          path: launcher/**/build/outputs/apk/debug/*.apk
