
name: 1 - Importer MeyzLauncher dans le repo

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Depot a cloner"
        default: "DumDum192/Amethyst-Offline"
        required: true
        type: string
      upstream_branch:
        description: "Branche (vide = branche par defaut)"
        default: ""
        type: string
      theme_hue:
        description: "Teinte (210 bleu, 195 bleu clair, 0 inchange)"
        default: "210"
        type: string
      force:
        description: "Ecraser le dossier launcher existant"
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: MeyzLauncher
  APP_ID: com.meyz.launcher

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le depot MeyzLauncher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier le dossier launcher
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          if [ -d launcher ] && [ "$FORCE" != "true" ]; then
            echo "::error::launcher existe deja. Relance avec force=true."
            exit 1
          fi
          rm -rf launcher

      - name: Configurer Git HTTPS pour les sous-modules
        run: |
          git config --global \
            url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add \
            url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Cloner Amethyst-Offline et ses sous-modules
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        run: |
          set -e

          URL="https://github.com/${UPSTREAM_REPO}.git"

          if [ -n "$UPSTREAM_BRANCH" ]; then
            git clone --depth 1 --branch "$UPSTREAM_BRANCH" \
              "$URL" /tmp/amethyst-offline
          else
            git clone --depth 1 "$URL" /tmp/amethyst-offline
          fi

          cd /tmp/amethyst-offline

          if [ -f .gitmodules ]; then
            # Convertir les anciennes URL SSH en URL HTTPS
            sed -i \
              -e 's|git@github.com:|https://github.com/|g' \
              -e 's|ssh://git@github.com/|https://github.com/|g' \
              .gitmodules

            git submodule sync --recursive
            git submodule update --init --recursive
          fi

          test -d Amethyst-Android || {
            echo "::error::Le dossier Amethyst-Android est absent."
            exit 1
          }

          test -f android-build.sh || {
            echo "::error::android-build.sh est absent."
            exit 1
          }

      - name: Copier les sources dans launcher
        run: |
          set -e
          mkdir -p launcher
          cp -a /tmp/amethyst-offline/. launcher/

          # Ne pas conserver les metadonnees Git imbriquees.
          find launcher -depth -name .git \
            -exec rm -rf {} +

          rm -rf launcher/.github
          rm -f launcher/.gitmodules

      - name: Trouver le module Android
        run: |
          set -e
          cd launcher

          GRADLE="Amethyst-Android/app_pojavlauncher/build.gradle"

          if [ ! -f "$GRADLE" ]; then
            GRADLE="Amethyst-Android/app_pojavlauncher/build.gradle.kts"
          fi

          if [ ! -f "$GRADLE" ]; then
            echo "::error::Fichier Gradle Android introuvable."
            exit 1
          fi

          echo "GRADLE_FILE=$GRADLE" >> "$GITHUB_ENV"
          echo "MODULE_DIR=$(dirname "$GRADLE")" >> "$GITHUB_ENV"

      - name: Renommer MeyzLauncher
        run: |
          set -e
          cd launcher

          python3 - <<'PY'
          import os, re

          path = os.environ["GRADLE_FILE"]
          app_id = os.environ["APP_ID"]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          pattern = r'(?m)^(\s*applicationId\s+)[\'"]([^\'"]+)[\'"]'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + '"' + app_id + '"',
              content,
              count=1
          )

          if count:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)
              print("Application ID :", app_id)
          else:
              print("Attention : applicationId non trouve.")
          PY

          RES="$MODULE_DIR/src/main/res"

          if [ -d "$RES" ]; then
            export APP_NAME
            find "$RES" -path '*/values*/strings.xml' -type f \
              -exec python3 -c '
          import os, re, sys
          name = os.environ["APP_NAME"]
          for p in sys.argv[1:]:
              with open(p, encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(
                  r"(<string\s+name=\"app_name\"[^>]*>).*?(</string>)",
                  lambda m: m.group(1) + name + m.group(2),
                  s
              )
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)
          ' {} +
          fi

      - name: Remplacer les textes visibles
        run: |
          set -e
          cd launcher

          python3 - <<'PY'
          import os, re

          root = os.path.join(
              os.environ["MODULE_DIR"], "src/main/res"
          )

          pattern = re.compile(
              r"(?<![\w/-])(?:Amethyst|PojavLauncher|Pojav Launcher)(?![\w-])",
              re.I
          )

          for folder, _, files in os.walk(root):
              if not os.path.basename(folder).startswith("values"):
                  continue

              for filename in files:
                  if not filename.endswith(".xml"):
                      continue

                  path = os.path.join(folder, filename)

                  with open(path, encoding="utf-8") as f:
                      old = f.read()

                  # Garder les mentions legales et les credits.
                  lines = old.splitlines(keepends=True)
                  new_lines = []

                  for line in lines:
                      if re.search(
                          r"credit|licen|copyright|based on|fork|http|url",
                          line, re.I
                      ):
                          new_lines.append(line)
                      else:
                          new_lines.append(pattern.sub("MeyzLauncher", line))

                  new = "".join(new_lines)

                  if new != old:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(new)
          PY

      - name: Recolorer le theme
        env:
          THEME_HUE: ${{ inputs.theme_hue }}
        run: |
          set -e

          if [ "$THEME_HUE" = "0" ]; then
            echo "Theme conserve."
            exit 0
          fi

          python3 - <<'PY'
          import os, re, colorsys

          hue = float(os.environ["THEME_HUE"]) / 360
          root = os.path.join(
              "launcher", os.environ["MODULE_DIR"], "src/main/res"
          )

          pat = re.compile(r"#([0-9a-fA-F]{6})\b")

          def recolor(m):
              value = m.group(1)
              r, g, b = [
                  int(value[i:i+2], 16) / 255
                  for i in (0, 2, 4)
              ]
              h, light, sat = colorsys.rgb_to_hls(r, g, b)

              if sat < 0.15 or not (0.70 <= h <= 0.90):
                  return m.group(0)

              r, g, b = colorsys.hls_to_rgb(hue, light, sat)
              return "#" + "".join(
                  f"{round(v*255):02x}" for v in (r, g, b)
              )

          for folder, _, files in os.walk(root):
              if not re.match(
                  r"(values|drawable|color)", os.path.basename(folder)
              ):
                  continue

              for filename in files:
                  if not filename.endswith(".xml"):
                      continue

                  path = os.path.join(folder, filename)

                  with open(path, encoding="utf-8") as f:
                      old = f.read()

                  new = pat.sub(recolor, old)

                  if new != old:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(new)

          print("Theme personnalise.")
          PY

      - name: Remplacer les icones avec icon.png
        run: |
          set -e

          if [ ! -f icon.png ]; then
            echo "icon.png absent : icone par defaut conservee."
            exit 0
          fi

          sudo apt-get update -y
          sudo apt-get install -y imagemagick

          RES="launcher/$MODULE_DIR/src/main/res"
          ICON="$GITHUB_WORKSPACE/icon.png"

          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"

            mkdir -p "$RES/mipmap-$density"

            convert "$ICON" -resize "${size}x${size}!" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$RES/mipmap-$density/ic_launcher.png" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "Icones creees."

      - name: Verifier les fichiers importes
        run: |
          set -e
          test -f launcher/android-build.sh
          test -f "launcher/$GRADLE_FILE"
          echo "Sources importees."
          echo "Attention : cette etape ne compile pas l'APK."

      - name: Enregistrer dans le depot
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -f launcher

          if git diff --cached --quiet; then
            echo "Aucune modification a enregistrer."
            exit 0
          fi

          git commit -m "Importer Amethyst-Offline pour MeyzLauncher"
          git push
          
